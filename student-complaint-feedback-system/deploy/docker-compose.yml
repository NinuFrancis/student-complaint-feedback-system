services:
  backend:
    image: ${IMAGE_PREFIX}-backend:${IMAGE_TAG:-latest}
    container_name: campus-voice-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      FRONTEND_ORIGIN: "*"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ${IMAGE_PREFIX}-frontend:${IMAGE_TAG:-latest}
    container_name: campus-voice-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
